[tools]
python = "3.12"

[tasks.canon]
description = "Canonicalise and report the structural digest"
run = "python3 tools/stoa0.py conformance/conformance-01.json canon"

[tasks.validate]
description = "Run the conformance ruleset against the good fixture"
run = "python3 tools/stoa0.py conformance/conformance-01.json check"

[tasks.negative]
description = "The ruleset must fail on the negative fixture, exactly 13 times"
run = """
set -e
n=$(python3 tools/stoa0.py conformance/negative-01.json check | grep -c '^error')
echo "negative fixture: $n errors"
test "$n" -eq 13 || { echo "expected 13 errors, got $n"; exit 1; }
"""

[tasks.contract]
description = "Degradation contract: every unit of content survives projection to L0"
run = "python3 tools/stoa0.py conformance/conformance-01.json contract"

[tasks.merkle]
description = "Merkle root and an excerpt proof"
run = "python3 tools/stoa0.py conformance/conformance-01.json merkle"

[tasks.hash]
description = "Encoding independence: canonical JSON and deterministic CBOR must agree"
run = "python3 tools/structhash.py conformance/conformance-01.json"

[tasks.l0]
description = "Emit the L0 text projection"
run = "python3 tools/stoa0.py conformance/conformance-01.json l0"

[tasks.provenance]
description = "Check a document against the register it claims, offline"
run = "python3 tools/stoa0.py conformance/archived-01.json provenance"

[tasks."archive-register"]
description = "Snapshot the current register into the content-addressed archive"
run = """
h=$(python3 tools/stoa0.py registerhash)
cp spec/vocabulary.json "spec/registers/$h.json"
echo "archived $h"
"""

[tasks.l0freeze]
description = "L0 is frozen: assert the frozen layer has not moved"
run = "python3 tools/stoa0.py l0freeze"

[tasks.surface]
description = "M0c: surface fixed point, both directions"
run = "python3 tools/surface.py conformance/conformance-01.json fixedpoint"

[tasks.golden]
description = "Regenerate the golden L0 projection and the generated spec"
run = """
python3 tools/stoa0.py conformance/conformance-01.json l0 > conformance/expected/conformance-01.l0.txt
python3 tools/stoa0.py register > spec/VOCABULARY.md
python3 tools/surface.py conformance/conformance-01.json emit > conformance/conformance-01.stoa
"""

[tasks.golden-check]
description = "The golden output and generated spec must be current"
run = """
set -e
python3 tools/stoa0.py conformance/conformance-01.json l0 | diff -u conformance/expected/conformance-01.l0.txt - > /dev/null \
  || { echo "golden L0 projection is stale: run 'mise run golden'"; exit 1; }
python3 tools/stoa0.py register | diff -u spec/VOCABULARY.md - > /dev/null \
  || { echo "spec/VOCABULARY.md is stale: run 'mise run golden'"; exit 1; }
python3 tools/surface.py conformance/conformance-01.json emit | diff -u conformance/conformance-01.stoa - > /dev/null \
  || { echo "surface document is stale: run 'mise run golden'"; exit 1; }
echo "golden outputs current"
"""

[tasks.fuzz]
description = "Fuzz the parser, validator and emitters with hostile input"
run = "python3 tools/fuzz.py --n 5000"

[tasks.corpus]
description = "Corpus 1: administrative notices (Diavgeia, Greek)"
run = "python3 tools/diavgeia.py --n 100"

[tasks."corpus-rfc"]
description = "Corpus 2: standards documents (IETF RFCs, XML v3)"
run = "python3 tools/rfc.py"

[tasks."corpus-jats"]
description = "Corpus 3: scholarly articles (JATS, Europe PMC)"
run = "python3 tools/jats.py"

[tasks."corpus-forms"]
description = "Corpus 4: public-sector forms, which is what tests L2"
run = "python3 tools/forms.py"

[tasks."corpus-law"]
description = "Corpus 5: UK legislation (CLML, legislation.gov.uk)"
run = "python3 tools/legislation.py"

[tasks.evidence]
description = "Evidence audit: what justifies each element in the register"
run = "python3 tools/evidence.py --write"

[tasks.corpora]
description = "Both corpora"
depends = ["corpus", "corpus-rfc", "corpus-jats", "corpus-forms", "corpus-law", "evidence"]

[tasks.selftest]
description = "Self-test the toolchain: merkle at every index, CBOR edge cases, degradation totality, injection"
run = "python3 tools/selftest.py"

[tasks.check]
description = "Everything that does not touch the network"
depends = ["canon", "validate", "negative", "contract", "merkle", "hash", "golden-check", "selftest", "surface", "provenance", "l0freeze", "fuzz"]
